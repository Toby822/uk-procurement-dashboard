name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m procurement.index
      - run: python -m procurement.dashboard
      - run: python -m procurement.verify
      - run: python -m unittest procurement.test_index -v
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest procurement.test_dashboard -v
